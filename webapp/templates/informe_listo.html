<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Informe generado</title>
<style>
  body { font-family: Georgia, 'Times New Roman', serif; background:#f4f6f5; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
  .card { background:#fff; border-radius:10px; padding:36px 40px; box-shadow:0 2px 10px rgba(0,0,0,.08); text-align:center; max-width:420px; }
  h1 { font-size:19px; color:#2f4f47; margin-bottom:8px; }
  p { color:#555; font-size:14px; }
  a.btn { display:inline-block; margin-top:18px; background:#5C8C82; color:#fff; text-decoration:none; padding:12px 22px; border-radius:6px; font-size:15px; }
  a.btn:hover { background:#487267; }
  a.otro { display:block; margin-top:14px; font-size:13px; color:#5C8C82; }
</style>
</head>
<body>
  <div class="card">
    <h1>✔ Informe generado con éxito</h1>
    <p>El documento Word ya está listo para descargar.</p>
    <a class="btn" href="{{ url_for('descargar', nombre_archivo=nombre_archivo) }}">Descargar informe (.docx)</a>
    <a class="otro" href="{{ url_for('informe_nuevo') }}">Generar otro informe</a>
  </div>
</body>
</html>
